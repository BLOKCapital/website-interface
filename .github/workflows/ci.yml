name: CI

on:
  pull_request:
  push:
    branches: [main, redesign]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, build, checks, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Tighten to `npm run lint -- --max-warnings=0` once the two unused-import
      # warnings in src/app/indices/[id]/page.tsx are gone (X-03).
      - name: Lint
        run: npm run lint

      - name: Build (static export to out/)
        run: npm run build

      - name: Dead Tailwind classes
        run: npm run check:classes

      - name: Internal links, anchors and assets
        run: npm run check:links

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright suite
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/.output/
          retention-days: 7
